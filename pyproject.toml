[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp4cm"
version = "0.1.0"
description = "Model cleansing tools for model-driven engineering datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "pyecore>=0.15",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "ruff>=0.15.17"]
ml = [
    "node2vec>=0.4",
    "torch>=2.0",
    "transformers>=4.40",
]

[tool.setuptools.packages.find]
include = ["mcp4cm*"]

[tool.setuptools.package-data]
"mcp4cm.parsers.uml_xml_pyecore" = [
    "metamodel/LICENSE",
    "metamodel/NOTICE.md",
    "metamodel/ORIGIN.md",
    "metamodel/plugins/org.eclipse.uml2.uml/model/*",
    "metamodel/plugins/org.eclipse.uml2.types/model/*",
    "metamodel/plugins/org.eclipse.uml2.uml.resources/libraries/*",
    "metamodel/plugins/org.eclipse.uml2.uml.resources/profiles/*",
    "metamodel/plugins/org.eclipse.uml2.uml.resources/metamodels/*",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # simplification rules
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
