[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp4cm"
version = "0.1.0"
description = "Model cleansing tools for model-driven engineering datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "pyecore>=0.15",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]
ml = [
    "node2vec>=0.4",
    "torch>=2.0",
    "transformers>=4.40",
]

[tool.setuptools.packages.find]
include = ["mcp4cm*"]
